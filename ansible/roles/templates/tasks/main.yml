---
- name: Deploy pure-infra components (1:1 copy)
  copy:
    src: "{{ item.src }}"
    dest: "{{ dev_home }}/{{ item.dest }}"
    owner: aldo
    group: aldo
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - src: "/home/aldo/dev/01-core-infra/templates/systemd/app-freellmapi.service"
      dest: "01-core-infra/templates/systemd/app-freellmapi.service"
      mode: "0644"
    - src: "/home/aldo/dev/01-core-infra/templates/systemd/app-hermes-gateway.service"
      dest: "01-core-infra/templates/systemd/app-hermes-gateway.service"
      mode: "0644"
    - src: "/home/aldo/dev/01-core-infra/templates/systemd/app-hermes-web.service"
      dest: "01-core-infra/templates/systemd/app-hermes-web.service"
      mode: "0644"
    - src: "/home/aldo/dev/01-core-infra/templates/cron/01-core-infra.cron"
      dest: "01-core-infra/templates/cron/01-core-infra.cron"
      mode: "0644"
    - src: "/home/aldo/dev/01-core-infra/templates/infra/02-ai-freellmapi/infra/docker-compose.yml"
      dest: "01-core-infra/templates/infra/02-ai-freellmapi/infra/docker-compose.yml"
      mode: "0644"
    - src: "/home/aldo/dev/01-core-infra/templates/infra/02-ai-freellmapi/infra/.env.template"
      dest: "01-core-infra/templates/infra/02-ai-freellmapi/infra/.env.template"
      mode: "0644"
    - src: "/home/aldo/dev/01-core-infra/templates/infra/repos.manifest.jsonc"
      dest: "01-core-infra/templates/infra/repos.manifest.jsonc"
      mode: "0644"
    - src: "/home/aldo/dev/01-core-infra/install.sh"
      dest: "01-core-infra/install.sh"
      mode: "0755"
    - src: "/home/aldo/dev/01-core-infra/backup.sh"
      dest: "01-core-infra/backup.sh"
      mode: "0755"
    - src: "/home/aldo/dev/01-core-infra/healthcheck.sh"
      dest: "01-core-infra/healthcheck.sh"
      mode: "0755"
    - src: "/home/aldo/dev/01-core-infra/.gitignore"
      dest: "01-core-infra/.gitignore"
      mode: "0644"
    - src: "/home/aldo/dev/01-core-infra/README.md"
      dest: "01-core-infra/README.md"
      mode: "0644"
  when: item.dest is defined