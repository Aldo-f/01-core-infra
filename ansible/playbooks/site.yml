---
- name: Rebuild development environment
  hosts: localhost
  become: true
  gather_facts: yes
  vars:
    dev_home: "/home/aldo/dev"
    infra_dir: "{{ dev_home }}/01-core-infra"
    template_dir: "{{ infra_dir }}/templates"
    infra_templates: "{{ template_dir }}/infra"
    repo_manifest: "{{ infra_templates }}/repos.manifest.jsonc"
    ollama_api_key_file: "/home/aldo/.config/ollama/api_key"
    container_test: false  # zet op true bij testen in Docker (skips daemon-afhankelijke tasks)

  pre_tasks:
    - name: Detect system RAM in MB
      command: awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo
      register: ram_output
      changed_when: false

    - name: Set ram_mb fact
      set_fact:
        ram_mb: "{{ ram_output.stdout | int }}"

    - name: Select Ollama model based on RAM
      set_fact:
        ollama_model: >-
          {{
            'qwen3:4b' if ram_mb < 12000
            else 'qwen3:8b' if ram_mb < 20000
            else 'qwen3.6:27b-q4_K_M'
          }}

  # no roles needed – we inline the required actions

  tasks:
    - name: Ensure Toerekening target directory exists
      file:
        path: "/home/aldo/dev/06-apps-toerekening"
        state: directory
        mode: "0755"

    - name: Deploy Toerekening templates (copy)
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}"
      loop:
        - src: "/home/aldo/dev/01-core-infra/templates/apps/toerekening/Dockerfile"
          dest: "/home/aldo/dev/06-apps-toerekening/Dockerfile"
          mode: "0644"
        - src: "/home/aldo/dev/01-core-infra/templates/apps/toerekening/docker-compose.yml"
          dest: "/home/aldo/dev/06-apps-toerekening/docker-compose.yml"
          mode: "0644"
        - src: "/home/aldo/dev/01-core-infra/templates/apps/toerekening/.env"
          dest: "/home/aldo/dev/06-apps-toerekening/.env"
          mode: "0644"
        - src: "/home/aldo/dev/01-core-infra/templates/apps/toerekening/package.json"
          dest: "/home/aldo/dev/06-apps-toerekening/package.json"
        - src: "/home/aldo/dev/01-core-infra/templates/apps/toerekening/package-lock.json"
          dest: "/home/aldo/dev/06-apps-toerekening/package-lock.json"

    - name: Bring up toerekening via Docker Compose
      command: docker compose -f /home/aldo/dev/06-apps-toerekening/docker-compose.yml up -d
      args:
        chdir: /home/aldo/dev/06-apps-toerekening