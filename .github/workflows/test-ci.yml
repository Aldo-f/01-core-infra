name: Test Ansible Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
      
      - name: Test Ansible syntax
        run: |
          ansible-playbook --syntax-check 01-core-infra/ansible/playbooks/site.yml
      
      - name: Run Ansible lint
        run: |
          ansible-lint 01-core-infra/ansible/playbooks/site.yml