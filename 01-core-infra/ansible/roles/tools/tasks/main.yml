- name: Make fish the default login shell
  shell: |
    fish_path=$(command -v fish)
    grep -qxF "$fish_path" /etc/shells || echo "$fish_path" | sudo tee -a /etc/shells
    sudo chsh -s "$fish_path" "aldo"
  when: "'fish' in tools_sentries"

- name: Download and install NVM
  shell: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.6/install.sh | bash
  args:
    creates: /home/aldo/.nvm/nvm.sh
  when: "'nvm' in tools_sentries"

- name: Load NVM in current shell and verify installation
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
    command -v nvm
  when: "'nvm' in tools_sentries"

- name: Install and activate LTS Node.js version via NVM
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    nvm install --lts
    nvm use --lts
  args:
    creates: /home/aldo/.nvm/versions/node/v*/bin/node
  when: "'nvm' in tools_sentries"

- name: Verify Node.js and npm installation
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    node -v
    npm -v
  when: "'nvm' in tools_sentries"

- name: Install LM Studio
  shell: curl -fsSL https://lmstudio.ai/install.sh | bash
  args:
    creates: /home/aldo/.lmstudio/bin/lms
  when: "'lmstudio' in tools_sentries"

- name: Enable LM Studio link
  command: /home/aldo/.lmstudio/bin/lms link enable
  become: true
  become_user: aldo
  when: "'lmstudio' in tools_sentries and not container_test"

- name: Start LM Studio daemon
  command: /home/aldo/.lmstudio/bin/lms daemon up
  become: true
  become_user: aldo
  when: "'lmstudio' in tools_sentries and not container_test"

- name: Install nodejs
  shell: curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash - && sudo apt-get install -y nodejs
  args:
    creates: /usr/bin/node
  become: true
  when: "'node' in tools_sentries"

- name: Install pnpm
  shell: sudo npm install -g pnpm
  args:
    creates: /usr/local/bin/pnpm
  become: true
  when: "'pnpm' in tools_sentries"

- name: Install spec‑kit (clone repository)
  git:
    repo: https://github.com/github/spec-kit.git
    dest: "/home/{{ ansible_user }}/.local/spec-kit"
    version: main
    update: yes
  when: "'spec_kit' in tools_sentries"

- name: Install spec‑kit Python package (editable)
  pip:
    name: /home/{{ ansible_user }}/.local/spec-kit
    editable: true
    state: present
  when: "'spec_kit' in tools_sentries"

- name: Ensure bash config has PATH for user local bin (pip binaries)
  lineinfile:
    path: /home/{{ ansible_user }}/.bashrc
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    create: yes
    insertafter: EOF
  when: "'spec_kit' in tools_sentries"

- name: Ensure bash config has PATH for spec‑kit venv bin
  lineinfile:
    path: /home/{{ ansible_user }}/.bashrc
    line: 'export PATH="$HOME/.local/spec-kit-venv/bin:$PATH"'
    create: yes
    insertafter: EOF
  when: "'spec_kit' in tools_sentries"


- name: Install fvm
  shell: curl -fsSL https://fvm.app/install.sh | bash
  args:
    creates: /home/aldo/fvm/bin/fvm
  when: "'fvm' in tools_sentries"

- name: Install ollama
  shell: curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: /usr/bin/ollama
  become: true
  when: "'ollama' in tools_sentries"

- name: Install hermes
  shell: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-setup --skip-browser
  args:
    creates: /home/aldo/.hermes/bin/hermes
  when: "'hermes' in tools_sentries"

- name: Install opencode
  shell: curl -fsSL https://opencode.ai/install | bash
  args:
    creates: /home/aldo/.opencode/bin/opencode
  when: "'opencode' in tools_sentries"

- name: Install tailscale
  shell: curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale
  become: true
  when: "'tailscale' in tools_sentries"

- name: Install OMO (oh-my-openagent)
  shell: bunx oh-my-openagent install --no-tui --platform=opencode --claude=no --gemini=no --copilot=no && mkdir -p ~/.config/opencode && touch ~/.config/opencode/.omo-installed-by-01-core-infra
  args:
    creates: ~/.config/opencode/.omo-installed-by-01-core-infra
  when: "'opencode' in tools_sentries and 'bun' in tools_sentries"
