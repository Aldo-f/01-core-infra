- name: Update apt cache
  apt:
    update_cache: yes
  become: true

- name: Install Docker.io
  apt:
    name: docker.io
    state: present
  become: true

- name: Add aldo to docker group
  user:
    name: aldo
    groups: docker
    append: yes
  become: true

- name: Enable and start Docker service
  service:
    name: docker
    state: started
    enabled: yes
  become: true

- name: Wait for Docker socket
  wait_for:
    path: /var/run/docker.sock
    state: socket
    timeout: 30
  become: true

- name: Clone freellmapi repository
  shell: |
    git clone --branch upstream https://github.com/aldo-f/freellmapi /home/aldo/dev/02-ai-freellm
  args:
    creates: /home/aldo/dev/02-ai-freellm/server/package.json

- name: Install dependencies and build freellmapi
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    nvm use default >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
    cd /home/aldo/dev/02-ai-freellm
    npm ci
    npm run build
  args:
    executable: /bin/bash
    creates: /home/aldo/dev/02-ai-freellm/server/dist
  become_user: aldo
  when: "'freellmapi' in tools_sentries"

- name: Load freellmapi vault credentials
  include_vars:
    file: "{{ lookup('env', 'HOME') }}/dev/01-core-infra/vaults/freellmapi-credentials.yml"
  no_log: true

- name: Render freellmapi .env from vault (idempotent)
  copy:
    dest: "{{ freellmapi_runtime_dir }}/.env"
    content: |
      # FreeLLMAPI environment — rendered by Ansible from vault
      # (01-core-infra/vaults/freellmapi-credentials.yml). DO NOT edit manually:
      #
      # Any Ansible run re-renders this file. If the source vault entry changes,
      # the file will be rewritten; otherwise it stays unchanged.
      ENCRYPTION_KEY={{ vault_freellmapi_encryption_key }}
      PORT={{ vault_freellmapi_port }}
      HOST_BIND={{ vault_freellmapi_host_bind }}
      REQUEST_ANALYTICS_RETENTION_DAYS={{ vault_freellmapi_analytics_retention_days }}
      REQUEST_ANALYTICS_MAX_ROWS={{ vault_freellmapi_analytics_max_rows }}
    owner: aldo
    group: aldo
    mode: "0600"
  no_log: true
  register: env_file_render
  changed_when: env_file_render.diff is defined or (env_file_render.checksum|default('') != '')

- name: Deploy freellmapi service
  shell: |
    cd /home/aldo/dev/02-ai-freellm
    docker-compose up -d
  args:
    creates: /home/aldo/dev/02-ai-freellm/server/dist
  become_user: aldo
  when: "'freellmapi' in tools_sentries"