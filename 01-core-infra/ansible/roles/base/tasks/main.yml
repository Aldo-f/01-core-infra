---
- name: Install git
  apt:
    name: git
    state: present
  when: ansible_facts.packages['git'] is not defined

- name: Install tree
  apt:
    name: tree
    state: present
  when: ansible_facts.packages['tree'] is not defined

- name: Install Docker
  shell: curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker

- name: Add aldo to docker group
  user:
    name: aldo
    groups: docker
    append: yes

- name: Add aldo to www-data group
  user:
    name: aldo
    groups: www-data
    append: yes
