---
- name: Rebuild development environment
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    script_dir: "/home/aldo/dev/01-core-infra"
    template_dir: "{{ script_dir }}/templates"
    repo_manifest: "{{ template_dir }}/repos.manifest.jsonc"
    ollama_api_key_file: "/home/aldo/.config/ollama/api_key"
    container_test: false
    traefik_network: "traefik_net"
    home_dir: "/home/aldo"
    dev_home: "/home/aldo/dev"
    infra_dir: "/home/aldo/dev/01-core-infra"
    ansible_user: aldo
    tools_sentries:
      - docker
      - nvm
      - node
      - npm
      - pnpm
      - bun
      - fvm
      - tree
      - ollama
      - llama-server
      - locate
      - lmstudio
      - fish
      - hermes
      - opencode
      - omo
      - mem0
      - freellmapi
      - script_google
      - tailscale
  pre_tasks:
    - name: Ensure bun binary is in system PATH
      file:
        src: "/home/aldo/.bun/bin/bun"
        dest: "/usr/local/bin/bun"
        state: link
        force: yes
      become: true
  roles:
    - "base"
    - "tools"
    - "templates"
    - "systemd"
    - "llamacpp"
    - "neo-brutalist-home"
    - "manifest-repos"
    - "cron"
    - "hermes-skills"
    - "freellmapi"
    - "mesh_sync"
    - "containers"
    - "nextcloud-sync"