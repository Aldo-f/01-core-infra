version: '3.9'

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - WEBUI_PORT=8080
    volumes:
      - /mnt/HDD1/qbittorrent/config:/config
      - /mnt/HDD1/downloads:/downloads
    networks:
      - traefik_net

networks:
  traefik_net:
    external: true