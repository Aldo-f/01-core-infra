version: '3.9'

services:
  db:
    image: mariadb:10.6
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD={{ vault_nextcloud_mysql_root_password }}
      - MYSQL_PASSWORD={{ vault_nextcloud_mysql_password }}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  app:
    image: nextcloud
    restart: always
    volumes:
      - /mnt/HDD1/nextcloud:/var/www/html
    environment:
      - MYSQL_PASSWORD={{ vault_nextcloud_mysql_password }}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
    networks:
      - traefik_net
    depends_on:
      - db

volumes:
  db_data:

networks:
  traefik_net:
    external: true